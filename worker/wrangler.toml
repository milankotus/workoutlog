# Cloudflare Worker config for the workout-log sync backend.
#
# The `name` MUST stay "workout-sync" so the deployed URL remains
# https://workout-sync.milan-kotus.workers.dev (the app hard-codes it).
#
# Setup (one time):
#   1. wrangler login
#   2. wrangler kv namespace create WORKOUT_KV
#        -> copy the printed `id` into the [[kv_namespaces]] block below
#   3. wrangler secret put AUTH_PIN        (skip if it already exists — it carries over)
#   4. wrangler deploy
#
# AUTH_PIN is a secret and is NOT stored here.

name = "workout-sync"
main = "worker.js"
compatibility_date = "2026-05-26"

# account_id is auto-detected after `wrangler login`. If wrangler asks for it,
# uncomment and paste your Cloudflare account ID:
# account_id = "..."

[[kv_namespaces]]
binding = "WORKOUT_KV"
id = "PASTE_KV_NAMESPACE_ID_HERE"
